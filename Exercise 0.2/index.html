<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Energy Data Webpage - Exercise 0.2</title>
    <!-- Link to the CSS file in the css folder -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <!-- Referencing the image from the images folder -->
        <img src="images/PowerIcon.png" alt="Power Icon" id="logo">
        <h1>Energy Data Dashboard</h1>
    </header>

    <main>
        <section id="data-overview">
            <h2>Welcome to the Energy Webpage</h2>
            <p>This page will serve as the foundation for future data visualisation tasks.</p>
            
            <!-- A placeholder area for your future data/charts -->
            <div id="chart-container">
                <p id="status-message">Loading data visualization components...</p>
            </div>
        </section>
    </main>

    <!-- Link to the JS file in the js folder -->
    <script src="js/scripts.js"></script>
</body>
</html>
