<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Exercise 5.1 - Ngai Jun Min</title>
    <!-- Load D3 -->
    <script src="https://d3js.org/d3.v7.min.js"></script>
    
    <!-- Basic styling for the responsive container -->
    <style>
        .responsive-svg-container {
            font-family: sans-serif;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <!-- Create a div for your chart to appear in with an id attribute[cite: 30] -->
    <div id="bar-chart" class="responsive-svg-container"></div>
    <div id="line-chart" class="responsive-svg-container"></div>
    <div id="donut-chart" class="responsive-svg-container"></div>
    
    <!-- Load your custom script from the js folder[cite: 30] -->
    <script src="js/chart.js"></script> 
    <script src="js/line-chart.js"></script>
    <script src="js/donut-chart.js"></script>
</body>
</html>
